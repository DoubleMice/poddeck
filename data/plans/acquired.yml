    summary: >-
      In 1984, the Walt Disney Company was worth more dead than alive. Disney Animation — the heart of Walt's famous
      flywheel — had stagnated for years, bleeding away talent while corporate raiders circled, salivating over offers
      to sell off the film library to MGM and offload the parks to hotel operators. But what followed instead was the
      greatest turnaround in media history under Michael Eisner and Frank Wells. Beauty and the Beast. The Lion King.
      Broadway. Bringing the Disney Vault home on VHS and DVD. And the greatest media acquisition of all time — ESPN.


      And then... it all almost fell apart. Again. Euro Disney turned into a money pit. Boardroom and executive
      infighting ran rampant. Animation descended into a dumpster fire. (Remember Chicken Little? Us neither.) Comcast —
      Comcast!! — tried to steal the company via a hostile takeover. Out of the chaos, a new generation of Disney
      management emerged under Bob Iger to stage yet another epic comeback with Pixar, Marvel and Lucasfilm, creating
      the defining media empire of the 21st century…until the tech companies came along. Tune in for the ultimate
      Acquired thrill ride: Disney, Part II.


