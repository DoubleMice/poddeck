    summary: >-
      In this Soap Box edition of the Risky Business podcast host Patrick Gray chats with Adam Pointon, CEO of Knocknoc,
      about the failure of Zero Trust as a comprehensive architecture.


      Most networks look like they were designed in 1999, and most Zero Trust products look like they were designed for
      2049.


      Instead, Patrick and Adam pitch something in the middle: Zero Trust(ish) networks, where Zero Trust principles are
      applied selectively where possible.


      Instead of trying to re-architect entire networks, maybe it’s time we learned to apply Zero Trust principles
      selectively against risky assets. It’s a better approach than the status quo, which involves liberal use of the
      “risk accepted” stamp.


      This episode is also available on YouTube
