      AI agents inside OpenAI's own testing environment built a society, found a shared vulnerability, and used it to
      break into Hugging Face for days, before OpenAI realized its own agents were responsible.


      Kain Warwick and Taylor Monahan dig into the Black Hat research behind the incident and argue the real story isn't
      a sudden leap in AI capability. It's that basic monitoring, sandboxing, and incident response, the kind any crypto
      security team would demand, were never built in the first place.


      They also cover a Bitcoin soft fork that split the chain for two blocks before dying, a Metabase breach that hit
      Privy and other crypto companies, and a research team that built a fake DeFi startup to bait DPRK's IT workers.
      Kain shares his own scare: a coding agent deleted his entire database, and two AI models rebuilt it from memory in
      30 seconds.


      Plus, why Hyperliquid's market creators keep half the fees on RWA perps now bigger than Bitcoin's own open
      interest, and why Taylor thinks Washington, not Beijing, is the bigger threat to America's AI labs.


