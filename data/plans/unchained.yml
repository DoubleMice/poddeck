      Securitize took itself public twice this year: once through a direct listing, and once by tokenizing more than
      $265 million of its own stock via a SPAC with Cantor Equity Partners, testing whether Wall Street lets equities
      trade onchain.


      Carlos Domingo, founder and CEO of Securitize, joins Laura Shin to argue that much of crypto's tokenized stock
      boom is unauthorized, offshore paper exposing investors and issuers to real legal risk, and to make the case that
      transfer agents, not outside platforms, should control what gets tokenized.


      They cover Rule 611, the SEC rule locking onchain and offchain share prices together, the Securities Transfer
      Association's push for issuer authorization, and a Netflix stock split that left an unauthorized derivative
      trading five times off. Domingo also lays out Securitize's NYSE partnership, launching tokenized trading in the
      fourth quarter.


      The SEC is now weighing whether to unwind the rule that keeps those prices identical, with real stakes for how
      equities trade next.


