      Ethereum's core developers are considering a decision that could cut ETH's staking yield toward zero, and DeFi's
      biggest names are furious about it.


      Jérôme de Tychey, President of Ethereum-France and a co-author of EIP-8363, joins Kevin Owocki, founder of
      Gitcoin, and Oisín Kyne, CEO of DV Labs, to argue through the proposal's tradeoffs. Aave's Stani Kulechov,
      Ether.fi's Mike Silagadze, and Joseph Chalom have all pushed back, warning the change guts DeFi's biggest source
      of yield.


      They cover the Nakamoto coefficient and why a 51% staking cartel could censor blocks for free, why solo stakers
      could see after-tax income collapse, and why Oisín is skeptical of an enshrined liquid staking token. Jérôme
      defends why Ethereum can pay stakers less and still be more secure than rivals boasting 7% yields. All Core Devs
      meets Thursday, August 20, and the real deadline lands October 26, when the network decides if EIP-8363 is mature
      enough to move forward.


