      A firmware randomness bug buried in Coldcard's code since 2021 surfaced last week and has already drained over
      $100 million, an estimated 1,600 to 1,800 Bitcoin, across four attacker waves. Taylor Monahan makes the case that
      the culprit is not North Korea but professional GPU crackers, and explains why the dice-rolling ritual many early
      victims trusted still left them exposed.


      Sonya Kim, co-founder of 3F Labs, and Mike Silagadze, founder and CEO of ether.fi, debate where DeFi's
      responsibility ends after trade.xyz's SK Hynix perp swung from $1,128 to $917 on a thin premarket print, then turn
      to Ethereum's own monetary policy fight.


      That fight centers on EIP-8361, a proposal to cut ETH issuance that opened with only 48 hours for public comment,
      reviving the minimum viable issuance debate Sonya once worked through at Steakhouse. Silagadze calls cutting
      issuance economically unsound and warns it could push billions of dollars of ETH out of staking, while Kain
      Warwick argues the resulting chaos is good for an Ethereum governance culture that had grown too quiet. The
      conversation covers Coldcard's entropy failure, the dice rolls that did not save early victims, trade.xyz's oracle
      mispricing, and Ethereum's issuance fight.


