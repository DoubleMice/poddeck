    summary: "(00:27) - Leopold is Back!\r

      (29:21) - Big Tech Earnings\r

      (32:45) - Richard Craib is a mathematician, AI researcher, and founder of Numerai, an AI-driven quantitative hedge
      fund. Richard Craib discusses the distinction between genuine alpha and returns driven by concentrated risk,
      arguing that disciplined diversification, mathematical risk management, and sustainable long-term investing matter
      more than short-term gains or investor hero worship.\r

      (01:00:15) - Trae Stephens, co-founder of Anduril and general partner at Founders Fund, discusses volatile venture
      valuations, responsible fundraising, and the evolving defense-tech ecosystem. He also covers Anduril’s autonomous
      aircraft and rapid manufacturing expansion, the case for mandatory civil service, and Founders Fund’s investment
      strategy.\r

      (01:34:39) - Blake Resnick, founder and CEO of public-safety drone company BRINC, discusses the company’s $125
      million capital raise and tours its drones, recharging pods, R&D facilities, and factory. He explains BRINC’s
      plans to deploy autonomous emergency-response drones nationwide, its strategic partnership with Motorola
      Solutions, and opportunities for innovation across the domestic drone supply chain.\r

