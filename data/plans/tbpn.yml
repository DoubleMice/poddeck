    summary: "(00:26) - Open Source vs. Closed Source\r

      (38:51) - Mega-Startup School\r

      (45:02) - Luke Knight & Ronan Chambers discuss building ETN, the European Technology Network, and raising $1.6
      million at a $9 million post-money valuation. They outline ETN’s new studio, live-show model, and ambitions to
      expand into events, recruitment, investing, and other media verticals while highlighting the fun and challenges of
      producing a daily podcast.\r

      (01:00:15) - Gary Vaynerchuk is an entrepreneur, investor, and creator of VeeFriends. Gary Vaynerchuk discusses
      the rise of independent creators, emerging sports leagues, collectible culture, and the opportunities created by
      AI, emphasizing his ability to anticipate consumer trends and his ambition to build VeeFriends into a major
      entertainment franchise.\r

      (01:32:40) - Jonathan Jacobi discusses emerging from stealth with a 26-person AI robotics startup, backed by a $71
      million seed round. He explains its AI-powered robotic experiences, software-first foundation models,
      hardware-agnostic approach, and early commercial opportunities in logistics, entertainment, and healthcare.\r

      (01:42:48) - Dean Meyer discusses America’s growing dependence on Chinese open-source AI models, which may benefit
      from distillation of proprietary U.S. systems. The Sequoia Capital investor highlights the need for a legally
      supported American open-model ecosystem while warning of dependency, security, and potential backdoor risks.\r

      (01:53:43) - Brent Franson discusses Death Clock, the AI-powered longevity company he founded and leads, which
      predicts users’ life expectancy and creates personalized health plans. He explains its provocative branding, free
      nationwide blood testing, emphasis on essential biomarkers, and vision of using AI to make personalized healthcare
      more accessible while cautioning against overtesting and risky health experimentation.\r

      (02:06:06) - Matej Cernosek discusses Andrenum, a defense technology company building scalable sonar hardware and
      software for undersea surveillance. He highlights its $18 million Series A, rapid product development, successful
      naval deployments, and integration of low-cost buoys, machine learning, and command-and-control systems to detect
      submarines and other underwater vehicles.\r

      (02:16:23) - Justin Boitano, NVIDIA’s vice president of enterprise AI, discusses the Open Source AI Alliance and
      how open models, evaluations, and cybersecurity tools can strengthen collective defense. He argues that open and
      proprietary models complement each other, enabling enterprises to improve security, reduce costs, customize AI,
      and foster innovation through transparent testing and collaboration.


