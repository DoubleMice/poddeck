      (45:10) - Harley Finkelstein, president of Shopify, discusses the company’s strong growth and how AI-driven
      agentic commerce is helping shoppers discover niche products from independent merchants. He also explains how
      Shopify’s AI tools, including Sidekick and Autopilot, help merchants launch, optimize, and automate their
      businesses more effectively.\r

      (01:04:19) - John J. Giamatteo discusses his leadership as CEO of BlackBerry and the company’s transformation from
      smartphones to secure embedded software. He highlights BlackBerry’s automotive operating systems, cautious use of
      AI, partnerships, industrial robotics growth, and enduring focus on security, trust, and innovation.\r

      (01:19:50) - Jeremy Allaire, co-founder and CEO of financial technology company Circle, discusses stablecoins’
      integration into the traditional financial system, USDC’s growing role in global payments, and blockchain
      infrastructure’s evolution. He also highlights AI agents as a new form of digital labor, alongside the heightened
      cybersecurity and regulatory challenges created by powerful AI models.\r

      (01:40:03) - Mackenzie Burnett is the co-founder and CEO of Ambrook, a financial management software company built
      for farms, ranches, and other independent businesses in the real economy. Ambrook helps agricultural operators
      manage accounting, payments, and financial reporting, with the broader goal of strengthening rural businesses and
      American industry.\r

