    summary: "(02:08) - Hank Green Is Absolutely Right\r

      (17:03) - Astra Ends Math\r

      (21:50) - 1 Person $1M Companies\r

      (40:33) - 𝕏 Timeline Reactions\r

      (51:52) - Meta Faces an AI Timing Problem\r

      (57:45) - 𝕏 Timeline Reactions\r

      (01:03:31) - John Gruber, a technology writer and founder of Daring Fireball, discusses Apple’s response to rising
      component costs, its move toward lower-priced products and leasing, and its delayed but practical approach to AI.
      He also examines Apple’s complex relationship with Google, the risks of advertising within its ecosystem, and the
      possibility of an AI-related silicon acquisition.\r

      (01:42:22) - Shaun Maguire & Isaiah Taylor. Shaun Maguire discusses Sequoia’s high-conviction $1 billion
      investment in Isaiah Taylor’s nuclear energy company, highlighting Taylor’s exceptional intensity, talent, and
      focus on simple, scalable reactor designs. Their conversation covers the company’s plans for massive nuclear
      “gigasites,” recruiting elite engineers, powering AI infrastructure, and eventually producing cheaper industrial
      commodities.\r

      (01:57:54) - Justin Lopez discusses Base Power’s new Texas battery factory, $1 billion funding round at a $13
      billion valuation, and custom home battery system. He explains how Base provides affordable, reliable electricity
      through distributed energy storage and outlines its measured expansion into new markets through utility
      partnerships and localized operations.\r

      (02:11:34) - Beau Gaston discusses his passion project: a powerful, demon-like quadruped robot designed to operate
      dangerous tools such as chainsaws in hazardous environments. He explains that its centaur form provides stability
      and mobility on rough terrain, while its intimidating appearance deliberately warns people of its strength and
      potential danger.\r

      (02:26:54) - Ron Arel discusses his work as co-founder of Intology, a San Francisco company developing autonomous
      systems to automate scientific discovery and AI R&D. He outlines progress in automated language-model
      post-training, the challenges of costly verification and experimentation, and the company’s goal of deploying
      systems that autonomously conduct end-to-end research and produce discoveries.


