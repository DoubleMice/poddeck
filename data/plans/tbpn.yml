    summary: "(00:17) - Leopold Sold\r

      (12:14) - Martin Shkreli discusses the leveraged collapse of a major AI-focused hedge fund, explaining how forced
      liquidation, predatory short-selling, and excessive position sizing can rapidly destroy a portfolio. The former
      hedge fund manager and pharmaceutical executive also examines Citadel’s reported acquisition of the fund’s assets,
      the broader correction in AI stocks, and Wall Street’s recurring failure to heed the risks of leverage.\r

      (56:19) - Ferrari Undefeated\r

      (01:06:24) - Guillaume Verdon, founder of Extropic, discusses the company’s thermodynamic computing technology,
      which uses probabilistic electronics to run generative AI workloads with far greater energy efficiency. He also
      covers potential applications, government support for domestic chip manufacturing, AI safety and accelerationism,
      and the challenges of building a deep-tech company while maintaining a prominent public voice.\r

      (01:19:16) - 𝕏 Timeline Reactions\r

      (01:20:36) - Lulu Meservey discusses how founders and CEOs can build lasting relevance through consistent,
      authentic, and strategically focused communication rather than rage bait, viral stunts, or excessive media
      appearances. Drawing on her communications expertise at Rostra, she argues that leaders should prioritize trust,
      audience fit, principled messaging, and approaches that suit their individual personalities.\r

      (01:47:35) - Michael Kim is the founder of Cendana Capital, an institutional investor focused on pre-seed and
      seed-stage venture funds. Michael discusses Cendana’s growth, its approach to identifying promising fund managers,
      the importance of founder access and investment judgment, and lessons from both missed opportunities and
      exceptionally successful investments.\r

      (02:06:39) - Joon Sung discusses Simile’s $200 million fundraise and rapid growth as an applied AI lab building
      models that predict human behavior. He explains how its simulations help companies test products and understand
      customer preferences at scale while democratizing access to market insights.\r

      (02:17:35) - Karan Kunjur, co-founder and CEO of K2 Space, discusses the company’s $500 million funding round,
      successful first satellite mission, and more than $1 billion in signed contracts. He explains K2’s vision of
      building large, high-power satellites for commercial and national-security uses, including communications, orbital
      computing, and advanced space infrastructure.\r

      (02:28:35) - Vlad Tenev, co-founder and CEO of Robinhood, discusses the company’s record growth, expanding suite
      of financial products, and mission to broaden individual asset ownership. He also covers global markets, Robinhood
      Social, product design, and using mathematical superintelligence to verify software and improve cybersecurity.


