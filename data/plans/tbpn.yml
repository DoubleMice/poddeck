      (44:25) - Grace Lee, co-founder and CEO of Intelligence, discusses how Design Arena uses human preferences to
      improve AI-generated designs, games, and websites. She outlines the company’s vision for an intelligence
      marketplace and creative superintelligence that can turn ideas into real-world outputs with minimal friction.\r

      (59:27) - Samir Kaji, co-founder and CEO of Allocate, discusses the rapid growth of private markets, Allocate’s
      role connecting wealth advisors with private funds, and the risks of soaring AI valuations. He also examines
      emerging venture funds, solo general partners, public-market investing, and the dangers of leverage in venture
      capital.\r

      (01:20:59) - John Quinn discusses his successful appeal representing Perplexity against Amazon and the emerging
      legal challenges surrounding agentic AI, including contracts, liability, copyright, and unauthorized access. A
      prominent trial lawyer and founder of Quinn Emanuel, he also examines AI’s transformative impact on legal
      practice, data-center disputes, and litigation strategy.\r

      (01:49:31) - Nikhil Reddy discusses founding Kaizen in 2022 after working as an early engineer at Anduril, with
      the goal of modernizing outdated government software. He highlights Kaizen’s new counter-drone marketplace, which
      streamlines procurement for defense agencies, law enforcement, and allied nations while improving speed,
      usability, and taxpayer value.\r

      (01:59:06) - Art Levy & Russell Kaplan. Art discusses his new role as Cognition’s vice president of global
      partnerships, drawing on his experience building alliances and partner ecosystems. He explains how deep
      partnerships can drive sales, integrations, co-marketing, and acquisitions while helping Cognition expand globally
      and attract talented founders.\r

      (02:13:12) - Brendan Carr discusses his work as FCC chairman to strengthen U.S. technology and national security
      while reducing regulatory barriers. He covers restrictions on foreign-made robotics and drones, safer electronics
      testing, school screen time, satellite internet, and efforts to streamline FCC rules and approvals.


