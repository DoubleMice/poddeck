      (31:36) - Joe Weisenthal, co-host of Bloomberg’s *Odd Lots* podcast, discusses social media addiction, online
      discourse, and the escalating AI race. He examines open-source models, massive infrastructure spending, monopoly
      risks, and why AI may ultimately deliver meaningful benefits despite economic and social anxieties.\r

      (01:08:22) - Jameson Detwiler discusses his background as a mobility entrepreneur and his role as co-founder and
      CEO of CHIP, an electric low-speed utility vehicle startup. He explains CHIP’s customizable design, safety
      features, affordability, and plan to introduce remote-controlled parking before transitioning to full autonomy.\r

      (01:40:10) - Stanley Tang, co-founder and chief product officer of DoorDash, discusses the launch of DoorDash Air,
      the company’s in-house drone delivery program. He explains how advances in AI, hardware, and operational
      infrastructure are enabling autonomous deliveries, particularly in suburban areas, as part of DoorDash’s broader
      multimodal delivery network.\r

      (01:53:37) - Amjad Masad discusses Replit’s latest AI-powered design tools, open-model integrations, enterprise
      growth, and emerging opportunities in game development, robotics, and industrial design. The Replit founder and
      CEO also describes a future beyond prompting, where AI agents automate entire workflows, and encourages young
      people to view AI as an empowering tool for creating businesses and new opportunities.\r

      (02:10:18) - Adam Cohen discusses co-founding Weave, an AI prompt-routing company that helps engineering teams
      reduce costs by selecting the most efficient model for each task. He highlights Weave’s $13.5 million fundraising
      round, enterprise focus, potential savings of up to 80%, and plans to expand its San Francisco-based team.


